# Creates or destroys the dev environment. Started by hand, never by a
# merge, because applying creates resources that bill by the hour (ADR 0002,
# ADR 0011).
#
# The job runs in the "dev" GitHub Environment. That Environment must have
# required reviewers and a deployment branch rule limited to main: the
# apply role's trust policy checks the Environment name, not the branch
# (ADR 0009). Without those settings, anything that names the Environment
# could assume the apply role.

name: apply

on:
  workflow_dispatch:
    inputs:
      action:
        description: >-
          apply creates a NAT Gateway, an RDS instance and an EC2 instance,
          which bill by the hour until destroyed. destroy removes them.
        type: choice
        options:
          - apply
          - destroy
        default: apply

permissions:
  contents: read
  id-token: write

# Never two runs at once, and never cancel one halfway: an interrupted
# apply leaves a half-built environment and a held state lock.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  run:
    # Defence in depth next to the Environment's branch rule.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # An RDS instance alone can take a quarter of an hour.
    timeout-minutes: 60
    environment: dev
    defaults:
      run:
        shell: bash
        working-directory: envs/dev
    env:
      ACTION: ${{ inputs.action }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - name: Check the repository variables
        env:
          APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
        run: |
          if [ -z "${APPLY_ROLE_ARN}" ] || [ -z "${STATE_BUCKET}" ]; then
            echo "::error::Set the AWS_APPLY_ROLE_ARN and TF_STATE_BUCKET repository variables first (README, CI/CD)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Terraform version
        id: tf
        working-directory: .
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-central-1
          mask-aws-account-id: true

      - name: terraform init
        run: terraform init -input=false -backend-config="bucket=${STATE_BUCKET}"

      # Plan first and apply exactly that plan, so what runs is what the
      # summary shows.
      - name: terraform plan
        run: |
          if [ "${ACTION}" = "destroy" ]; then
            terraform plan -destroy -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
          else
            terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
          fi

      - name: Show the plan
        if: always()
        run: |
          {
            echo "### terraform ${ACTION} (envs/dev)"
            echo
            if [ "${ACTION}" = "apply" ]; then
              echo '**Cost:** this creates a NAT Gateway, an RDS instance and an EC2 instance. They bill by the hour until destroyed. Run this workflow again with `destroy` when finished.'
              echo
            fi
            echo '```'
            cat plan.txt 2>/dev/null || echo 'no plan produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform ${{ inputs.action }}
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan
