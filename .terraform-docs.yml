# terraform-docs configuration. Generates the requirements, inputs and
# outputs tables inside each module README, between the markers below.
# Text outside the markers is hand-written and left untouched.

formatter: "markdown table"

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

# No Providers section on purpose. When a module has a .terraform.lock.hcl
# (terraform validate creates one), terraform-docs prints the locked version
# there instead of the constraint, so the generated docs depend on local
# state. Requirements already shows the constraint.
content: |-
  {{ .Requirements }}

  {{ .Resources }}

  {{ .Inputs }}

  {{ .Outputs }}

sort:
  enabled: true
  by: name

settings:
  anchor: true
  default: true
  required: true
  sensitive: true
  type: true
